name: Pinned build toolchain
description: Install Java, Node, locked npm dependencies, and public dependency caches
inputs:
  cache-scope:
    default: tooling
    description: Distinct task-cache producer scope (matrix jobs must not race to save one key)
runs:
  using: composite
  steps:
    - name: Load repository toolchain configuration
      id: config
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../../../tools/pipeline/config.mjs"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: ${{ steps.config.outputs.javaVersion }}
        cache: maven
      if: hashFiles('**/pom.xml') != ''
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ steps.config.outputs.nodeVersion }}
        cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
    - shell: bash
      run: npm ci
      if: hashFiles('package-lock.json') != ''
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: |
          nx-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ github.ref }}-
          nx-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-refs/heads/main-

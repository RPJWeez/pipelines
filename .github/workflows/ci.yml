name: Pipeline tests
on:
  pull_request: null
  push:
    branches:
      - main
      - codex/**
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.18.4
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - name: Build shared verification toolchain
        run: docker build -f verification/Dockerfile -t application-verification:test .
      - name: Exercise app mount and native verification hook
        run: |
          docker run --rm -v "$PWD/tests/fixtures/verification-app:/source:ro" application-verification:test
      - name: Lint reusable workflows
        run: |-
          GOBIN="$RUNNER_TEMP/delivery-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/delivery-bin/actionlint" -ignore 'property "workflow_.*" is not defined' -ignore 'reusable workflow call "\$/\.github/workflows/(validate|package|promote).yml"'
      - name: Use isolated OCI-capable builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Exercise credential-free OCI and chart packaging
        run: node tools/delivery/smoke.mjs
  release-v1:
    name: Publish compatible v1 workflow version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: platform-v1
      cancel-in-progress: false
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then exit 0; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1" -f "sha=$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v1 -f "sha=$GITHUB_SHA"
          fi

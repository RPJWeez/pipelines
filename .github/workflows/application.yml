name: Reusable application delivery
on:
  workflow_call:
    inputs:
      chart:
        description: Application-owned candidate chart directory
        type: string
        required: true
      verify-command:
        description: Optional additional whole-application check; native projects are discovered automatically
        type: string
        default: ""
      project-checks:
        description: Optional JSON array of named native commands for repositories without Nx or additional checks
        type: string
        default: "[]"
    outputs:
      candidate:
        description: Complete candidate digest reference; empty on PRs
        value: ${{ jobs.publish-chart.outputs.candidate }}
permissions:
  contents: read
env:
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  DELIVERY_ROOT: ${{ github.workspace }}/.work/delivery
  DOCKER_BUILD_SUMMARY: "false"
jobs:
  plan:
    name: Discover projects, affected checks and images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      checks: ${{ steps.select.outputs.checks }}
      checks_count: ${{ steps.select.outputs.checks_count }}
      images: ${{ steps.select.outputs.images }}
      images_count: ${{ steps.select.outputs.images_count }}
      all_images: ${{ steps.select.outputs.all_images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Check out exact shared pipeline implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .work/delivery
          persist-credentials: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Install shared pipeline dependencies
        run: npm ci --prefix "$DELIVERY_ROOT" --omit=dev --ignore-scripts
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: ./.work/delivery/.github/actions/setup
        with:
          cache-scope: planning
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Discover native project checks and image targets
        id: select
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          VERIFICATION_COMMAND: ${{ inputs.verify-command }}
          PROJECT_CHECKS: ${{ inputs.project-checks }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |-
          mkdir -p .work
          node "$DELIVERY_ROOT"/tools/pipeline/projects.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: results-plan
          path: .work/plan.json
          include-hidden-files: true
        env:
          GITHUB_STEP_SUMMARY: /dev/null
  validate:
    name: ${{ matrix.label }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Check out exact shared pipeline implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .work/delivery
          persist-credentials: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Install shared pipeline dependencies
        run: npm ci --prefix "$DELIVERY_ROOT" --omit=dev --ignore-scripts
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: ./.work/delivery/.github/actions/setup
        with:
          cache-scope: project-${{ matrix.id }}
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.18.4
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Run project build, tests and declared checks
        id: check
        env:
          PROJECT_TASK: ${{ toJSON(matrix) }}
          GITHUB_STEP_SUMMARY: /dev/null
        shell: bash
        run: |-
          set -euo pipefail
          mkdir -p .work
          node "$DELIVERY_ROOT"/tools/pipeline/run-project.mjs 2>&1 | tee .work/validation.log
      - name: Record validation result
        if: always()
        env:
          CHECK_NAME: ${{ matrix.label }}
          VALIDATION_ARTIFACT: project-${{ matrix.id }}
          CHECK_RESULT: ${{ job.status }}
          LINT_RESULT: ""
          GITHUB_STEP_SUMMARY: /dev/null
        run: node "$DELIVERY_ROOT"/tools/pipeline/report.mjs validation "$CHECK_NAME" "$CHECK_RESULT" "$LINT_RESULT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-project-${{ matrix.id }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: project-${{ matrix.id }}
          path: |
            .work/validation.log
            **/target/surefire-reports/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
        env:
          GITHUB_STEP_SUMMARY: /dev/null
    if: needs.plan.outputs.checks_count != '0'
  publish-images:
    name: ${{ matrix.label }}
    needs:
      - plan
      - validate
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.images_count != '0' && (needs.validate.result == 'success' || (needs.plan.outputs.checks_count == '0' && needs.validate.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      BUILD_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      BUILDX_METADATA_PROVENANCE: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Check out exact shared pipeline implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .work/delivery
          persist-credentials: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Install shared pipeline dependencies
        run: npm ci --prefix "$DELIVERY_ROOT" --omit=dev --ignore-scripts
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Resolve this image and its trusted cache
        id: native
        run: |-
          set -euo pipefail
          mkdir -p .work
          export REGISTRY="${REGISTRY,,}"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          docker buildx bake --print application > .work/bake.json
          jq --arg target "$IMAGE_TARGET" --arg publish "$PUBLISH" '{target:{($target): ({"cache-from":["type=gha,scope=application-"+$target]} + (if $publish=="true" then {"cache-to":["type=gha,mode=max,scope=application-"+$target]} else {} end))}}' .work/bake.json > .work/cache.json
        env:
          IMAGE_TARGET: ${{ matrix.target }}
          PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4
        id: build
        with:
          source: .
          files: |
            docker-bake.hcl
            .work/cache.json
          targets: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          provenance: mode=max
          sbom: true
          set: ${{ github.event_name == 'pull_request' && '*.output=type=cacheonly' || '*.platform=linux/amd64' }}
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Persist native build metadata
        id: metadata
        if: always()
        shell: node {0}
        run: |
          const fs = require('node:fs');
          // JSON literal in the runner's script file, never an environment/argv payload.
          const metadata = ${{ toJSON(steps.build.outputs.metadata) }};
          if (typeof metadata !== 'string' || !metadata.trim()) {
            throw new Error('Build metadata unavailable; image publication remains unconfirmed.');
          }
          const parsed = JSON.parse(metadata);
          if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') {
            throw new Error('Expected native Bake metadata object.');
          }
          fs.mkdirSync('.work', {recursive: true});
          fs.writeFileSync('.work/metadata.json', metadata);
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Record native build outputs immediately
        if: always() && steps.metadata.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import {execFileSync} from 'node:child_process';
          const meta=JSON.parse(fs.readFileSync('.work/metadata.json','utf8'));
          const bake=JSON.parse(fs.readFileSync('.work/bake.json','utf8'));
          for (const [name, result] of Object.entries(meta)) {
            if (!/^sha256:[a-f0-9]{64}$/.test(result['containerimage.digest'])) continue;
            const image=bake.target[name].tags[0].split(':')[0];
            execFileSync('node',[process.env.DELIVERY_ROOT+'/tools/pipeline/report.mjs','record',name,'image','published',image,'',result['containerimage.digest'],'evidence generation pending'], {stdio:'inherit'});
          }
          JS
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-build-${{ matrix.target }}
          path: |
            .work/bake.json
            .work/metadata.json
          include-hidden-files: true
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Record this image build result
        if: always()
        env:
          CHECK_NAME: ${{ matrix.label }}
          CHECK_RESULT: ${{ job.status }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: node "$DELIVERY_ROOT"/tools/pipeline/report.mjs validation "$CHECK_NAME" "$CHECK_RESULT" ""
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-image-${{ matrix.target }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore
        env:
          GITHUB_STEP_SUMMARY: /dev/null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
  ci:
    name: Validation complete
    needs:
      - plan
      - validate
      - publish-images
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.validate.result }}
          IMAGES: ${{ needs.publish-images.result }}
          CHECKS_COUNT: ${{ needs.plan.outputs.checks_count }}
          IMAGES_COUNT: ${{ needs.plan.outputs.images_count }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |-
          test "$PLAN" = success || exit 1
          if [[ "$CHECKS" != success ]]; then
            [[ "$CHECKS_COUNT" = 0 && "$CHECKS" = skipped ]] || exit 1
          fi
          if [[ "$IMAGES" != success ]]; then
            [[ "$IMAGES_COUNT" = 0 && "$IMAGES" = skipped ]] || exit 1
          fi
  collect-images:
    name: Verify complete published image inventory
    needs:
      - plan
      - ci
      - publish-images
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.publish-images.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ needs.plan.outputs.all_images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Check out exact shared pipeline implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .work/delivery
          persist-credentials: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Install shared pipeline dependencies
        run: npm ci --prefix "$DELIVERY_ROOT" --omit=dev --ignore-scripts
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-build-*
          path: .work/native
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: results-plan
          path: .work/plan
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Require one completed native output for every application image
        run: node "$DELIVERY_ROOT"/tools/pipeline/collect-images.mjs .work/native .work/plan/plan.json
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-build
          path: |-
            .work/bake.json
            .work/metadata.json
          include-hidden-files: true
        env:
          GITHUB_STEP_SUMMARY: /dev/null
  image-evidence:
    needs:
      - ci
      - collect-images
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.collect-images.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.collect-images.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Check out exact shared pipeline implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .work/delivery
          persist-credentials: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Install shared pipeline dependencies
        run: npm ci --prefix "$DELIVERY_ROOT" --omit=dev --ignore-scripts
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-build
          path: .work
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Read exact native output
        id: image
        env:
          TARGET: ${{ matrix.target }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          digest=$(jq -er --arg target "$TARGET" '.[$target]["containerimage.digest"]' .work/metadata.json)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          tag=$(jq -er --arg target "$TARGET" '.target[$target].tags[0]' .work/bake.json)
          echo "name=${tag%:*}" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: .work/image.spdx.json
          upload-artifact: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          show-summary: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: .work/image.spdx.json
          push-to-registry: true
          show-summary: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        with:
          cosign-release: v3.1.4
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          cosign sign --yes "$IMAGE"
          bash "$DELIVERY_ROOT"/tools/pipeline/retain-release.sh "image-${{ matrix.target }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" .work/image.spdx.json
          node "$DELIVERY_ROOT"/tools/pipeline/report.mjs record '${{ matrix.target }}' image published '${{ steps.image.outputs.name }}' '' '${{ steps.image.outputs.digest }}' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/image-${{ matrix.target }}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-image-evidence-${{ matrix.target }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore
        env:
          GITHUB_STEP_SUMMARY: /dev/null
    name: Sign & attest image - ${{ matrix.target }}
  publish-chart:
    name: Publish complete candidate; QA pending
    needs:
      - ci
      - collect-images
      - image-evidence
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.collect-images.result == 'success' && needs.image-evidence.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Check out exact shared pipeline implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .work/delivery
          persist-credentials: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Install shared pipeline dependencies
        run: npm ci --prefix "$DELIVERY_ROOT" --omit=dev --ignore-scripts
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: ./.work/delivery/.github/actions/setup
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-build
          path: .work
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.18.4
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Select application-owned candidate chart
        run: |-
          set -euo pipefail
          test -f "$INPUT_CHART/Chart.yaml"
          echo "CHART_ROOT=$INPUT_CHART" >> "$GITHUB_ENV"
        env:
          INPUT_CHART: ${{ inputs.chart }}
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Bind native outputs and verify trusted image evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_SIGNER: ${{ job.workflow_repository }}/${{ job.workflow_file_path }}
          DELIVERY_REVISION: ${{ job.workflow_sha }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          set -euo pipefail
          node "$DELIVERY_ROOT"/tools/pipeline/candidate.mjs .work/bake.json .work/metadata.json "$CHART_ROOT/values.yaml" .work/bound
          jq -r '.images[]' .work/bound/build.json | while read -r image; do
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --signer-workflow "$DELIVERY_SIGNER" --signer-digest "$DELIVERY_REVISION" --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
            gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" --signer-workflow "$DELIVERY_SIGNER" --signer-digest "$DELIVERY_REVISION" --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --predicate-type https://spdx.dev/Document
          done
          cp .work/bound/values.yaml "$CHART_ROOT/values.yaml"
          cp .work/bound/build.json "$CHART_ROOT/build.json"
          echo "CANDIDATE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-candidates/$(helm show chart "$CHART_ROOT" | awk '/^name:/ {print $2}')" >> "$GITHUB_ENV"
          # Standard Helm package version, unique for every build attempt.
          VERSION="0.0.$GITHUB_RUN_ID-attempt.$GITHUB_RUN_ATTEMPT" node --input-type=module <<'JS'
          import fs from 'node:fs';
          const {parse,stringify}=await import(process.env.DELIVERY_ROOT+'/node_modules/yaml/dist/index.js');
          const p=process.env.CHART_ROOT+'/Chart.yaml'; const chart=parse(fs.readFileSync(p,'utf8'));
          chart.version=process.env.VERSION; chart.appVersion=process.env.GITHUB_SHA;
          fs.writeFileSync(p,stringify(chart));
          JS
          helm dependency build --skip-refresh "$CHART_ROOT"
          helm lint "$CHART_ROOT"
          helm template candidate "$CHART_ROOT" > .work/rendered.yaml
          node "$DELIVERY_ROOT"/tools/pipeline/candidate.mjs render .work/rendered.yaml .work/bound/build.json
      - uses: ./.work/delivery/.github/actions/publish-chart
        id: candidate
        with:
          project: application-candidate
          chart: ${{ env.CHART_ROOT }}
          registry: ghcr.io/${{ github.repository }}-candidates
          token: ${{ github.token }}
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ env.CANDIDATE_NAME }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
          show-summary: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.CANDIDATE_NAME }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          predicate-type: https://delivery-reference-platform.dev/candidate-build/v1
          predicate-path: .work/bound/build.json
          push-to-registry: true
          show-summary: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Record immutable handoff; no runtime qualification claimed
        env:
          REFERENCE: ${{ steps.candidate.outputs.reference }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('.work/handoff.json',JSON.stringify({candidate:process.env.REFERENCE,source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,state:'published',qa:'pending',certification:'pending'},null,2));
          JS
          node "$DELIVERY_ROOT"/tools/pipeline/report.mjs candidate "$REFERENCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-handoff
          path: .work/handoff.json
          include-hidden-files: true
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-publish-chart
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore
        env:
          GITHUB_STEP_SUMMARY: /dev/null
    outputs:
      candidate: ${{ steps.candidate.outputs.reference }}
  report:
    name: Application delivery summary
    permissions:
      contents: read
      actions: read
    needs:
      - plan
      - validate
      - publish-images
      - ci
      - collect-images
      - image-evidence
      - publish-chart
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Check out exact shared pipeline implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .work/delivery
          persist-credentials: false
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Install shared pipeline dependencies
        run: npm ci --prefix "$DELIVERY_ROOT" --omit=dev --ignore-scripts
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: results-*
          path: .work/results
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Read individual check results and log links
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          mkdir -p .work
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100&filter=latest" | jq '{jobs: [.[].jobs[]]}' > .work/jobs.json
      - name: Read run artifact links
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          mkdir -p .work
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > .work/attempt.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" | jq --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --slurpfile metadata .work/attempt.json '{runId:$run,attempt:$attempt,startedAt:$metadata[0].run_started_at,ownerType:$metadata[0].repository.owner.type,artifacts:[.[].artifacts[]]}' > .work/artifacts.json
      - name: Read release assets for observed publications
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: node "$DELIVERY_ROOT"/tools/pipeline/report.mjs release-links
      - name: Render actual execution results
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: node "$DELIVERY_ROOT"/tools/pipeline/report.mjs summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: report-download
        if: always()
        with:
          name: run-report
          path: |
            .work/run-report.json
            .work/summary.md
          include-hidden-files: true
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Write final human-readable summary
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          REPORT_ARTIFACT_ID: ${{ steps.report-download.outputs.artifact-id }}
        run: node "$DELIVERY_ROOT"/tools/pipeline/report.mjs summary --github-summary

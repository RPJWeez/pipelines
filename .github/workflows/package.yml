name: Legacy package adapter
on:
  workflow_call:
    inputs:
      operation:
        type: string
        default: release
        description: dev, release or compose
      chart:
        type: string
        default: ""
        description: Optional chart path when more than one application chart exists
      source-ref:
        type: string
        default: ""
        description: Same-repository branch for dev package
      candidate:
        type: string
        default: ""
        description: Immutable baseline candidate for composition
      overrides:
        type: string
        default: "{}"
        description: JSON component to immutable candidate reference mapping
      reason:
        type: string
        default: ""
        description: Reason for composing older components
      project-checks:
        type: string
        default: "[]"
        description: Native checks for non-Nx builds
    outputs:
      package:
        description: Immutable published chart
        value: ${{ jobs.build.outputs.package || jobs.compose.outputs.package }}
    secrets:
      platform-read-token:
        required: false
        description: Optional short-lived read-only token for private shared implementation repository
permissions:
  contents: read
jobs:
  build:
    if: inputs.operation != 'compose'
    uses: $/.github/workflows/build-package.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      operation: ${{ inputs.operation }}
      chart: ${{ inputs.chart }}
      source-ref: ${{ inputs.source-ref }}
      project-checks: ${{ inputs.project-checks }}
    secrets:
      platform-read-token: ${{ secrets.platform-read-token }}
  compose:
    if: inputs.operation == 'compose'
    uses: $/.github/workflows/compose-candidate.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    with:
      chart: ${{ inputs.chart }}
      candidate: ${{ inputs.candidate }}
      overrides: ${{ inputs.overrides }}
      reason: ${{ inputs.reason }}
    secrets:
      platform-read-token: ${{ secrets.platform-read-token }}

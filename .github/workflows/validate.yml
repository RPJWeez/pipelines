name: Application validation
on:
  workflow_call:
    inputs:
      chart:
        description: Application-owned candidate chart directory
        type: string
        required: false
        default: ""
      verify-command:
        description: Optional additional whole-application check; native projects are discovered automatically
        type: string
        default: ""
      project-checks:
        description: Optional JSON array of named native commands for repositories without Nx or additional checks
        type: string
        default: "[]"
      source-sha:
        type: string
        default: ""
        description: Exact source commit; empty for ordinary validation events
      full:
        type: boolean
        default: false
        description: Validate complete source for manual package creation
      deduplicate:
        type: boolean
        default: true
        description: Skip a branch push when an open PR already validates it
      container-proof:
        type: boolean
        default: true
        description: Build containers without publication; package creation performs its own image build
    secrets:
      platform-read-token:
        required: false
        description: Optional short-lived read-only token for private shared implementation repository
permissions:
  contents: read
env:
  VALIDATION_ONLY: "true"
  SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  DELIVERY_ROOT: ${{ github.workspace }}/.work/delivery
  DOCKER_BUILD_SUMMARY: "false"
jobs:
  plan:
    needs: event-gate
    if: needs.event-gate.outputs.run == 'true'
    uses: $/.github/workflows/check-source.yml
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      chart: ${{ inputs.chart }}
      project-checks: ${{ inputs.project-checks }}
      verify-command: ${{ inputs.verify-command }}
      source-sha: ${{ inputs.source-sha }}
      full: ${{ inputs.full }}
    secrets:
      platform-read-token: ${{ secrets.platform-read-token }}
  ci:
    name: Validation complete
    needs:
      - plan
      - image-checks
      - event-gate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.plan.result }}
          IMAGES: ${{ needs.image-checks.result }}
          CHECKS_COUNT: ${{ needs.plan.outputs.checks_count }}
          IMAGES_COUNT: ${{ inputs.container-proof && needs.plan.outputs.images_count || '0' }}
          GITHUB_STEP_SUMMARY: /dev/null
          EVENT_SELECTED: ${{ needs.event-gate.outputs.run }}
        run: |-
          if [[ "$EVENT_SELECTED" == false ]]; then exit 0; fi
          test "$PLAN" = success || exit 1
          if [[ "$CHECKS" != success ]]; then
            [[ "$CHECKS_COUNT" = 0 && "$CHECKS" = skipped ]] || exit 1
          fi
          if [[ "$IMAGES" != success ]]; then
            [[ "$IMAGES_COUNT" = 0 && "$IMAGES" = skipped ]] || exit 1
          fi
  report:
    name: Validation summary
    permissions:
      contents: read
      actions: read
    needs:
      - plan
      - image-checks
      - ci
      - event-gate
    if: always() && needs.event-gate.outputs.run != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GITHUB_STEP_SUMMARY: /dev/null
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - name: Check out exact shared pipeline implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .work/delivery
          persist-credentials: false
          token: ${{ secrets.platform-read-token || github.token }}
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Install shared pipeline dependencies
        run: npm ci --prefix "$DELIVERY_ROOT" --omit=dev --ignore-scripts
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: results-*
          path: .work/results
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Read individual check results and log links
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          mkdir -p .work
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100&filter=latest" | jq '{jobs: [.[].jobs[]]}' > .work/jobs.json
      - name: Read run artifact links
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          mkdir -p .work
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > .work/attempt.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" | jq --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --slurpfile metadata .work/attempt.json '{runId:$run,attempt:$attempt,startedAt:$metadata[0].run_started_at,ownerType:$metadata[0].repository.owner.type,artifacts:[.[].artifacts[]]}' > .work/artifacts.json
      - name: Read release assets for observed publications
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: node "$DELIVERY_ROOT"/tools/pipeline/report.mjs release-links
      - name: Render actual execution results
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: node "$DELIVERY_ROOT"/tools/pipeline/report.mjs summary
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: report-download
        if: always()
        with:
          name: run-report
          path: |
            .work/run-report.json
            .work/summary.md
          include-hidden-files: true
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Write final human-readable summary
        if: always()
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          REPORT_ARTIFACT_ID: ${{ steps.report-download.outputs.artifact-id }}
        run: node "$DELIVERY_ROOT"/tools/pipeline/report.mjs summary --github-summary
  event-gate:
    name: Check duplicate PR validation
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.event.outputs.run }}
    steps:
      - id: event
        env:
          GH_TOKEN: ${{ github.token }}
          DEDUPLICATE: ${{ inputs.deduplicate }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |-
          set -euo pipefail
          selected=true
          if [[ "$DEDUPLICATE" == true && "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            # On API uncertainty run validation rather than dropping checks.
            count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" --jq length) || count=0
            if [[ "$count" != 0 ]]; then selected=false; fi
          fi
          echo "run=$selected" >> "$GITHUB_OUTPUT"
  image-checks:
    name: ${{ matrix.label }}
    needs:
      - plan
    if: inputs.container-proof && needs.plan.result == 'success' && needs.plan.outputs.images_count != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      BUILD_TAG: sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      BUILDX_METADATA_PROVENANCE: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GITHUB_STEP_SUMMARY: /dev/null
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          persist-credentials: false
      - name: Check out exact shared pipeline implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .work/delivery
          persist-credentials: false
          token: ${{ secrets.platform-read-token || github.token }}
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Install shared pipeline dependencies
        run: npm ci --prefix "$DELIVERY_ROOT" --omit=dev --ignore-scripts
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Resolve this image and its trusted cache
        id: native
        run: |-
          set -euo pipefail
          mkdir -p .work
          export REGISTRY="${REGISTRY,,}"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"
          docker buildx bake --print application > .work/bake.json
          jq --arg target "$IMAGE_TARGET" --arg publish "$PUBLISH" '{target:{($target): ({"cache-from":["type=gha,scope=validation-"+$target]} + (if $publish=="true" then {"cache-to":["type=gha,mode=max,scope=application-"+$target]} else {} end))}}' .work/bake.json > .work/cache.json
        env:
          IMAGE_TARGET: ${{ matrix.target }}
          PUBLISH: "false"
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4
        id: build
        with:
          source: .
          files: |
            docker-bake.hcl
            .work/cache.json
          targets: ${{ matrix.target }}
          push: false
          provenance: mode=max
          sbom: true
          set: |-
            *.output=type=cacheonly
            *.platform=linux/amd64
            *.cache-to=
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Persist native build metadata
        id: metadata
        if: always()
        shell: node {0}
        run: |
          const fs = require('node:fs');
          // JSON literal in the runner's script file, never an environment/argv payload.
          const metadata = ${{ toJSON(steps.build.outputs.metadata) }};
          if (typeof metadata !== 'string' || !metadata.trim()) {
            throw new Error('Build metadata unavailable; image publication remains unconfirmed.');
          }
          const parsed = JSON.parse(metadata);
          if (!parsed || Array.isArray(parsed) || typeof parsed !== 'object') {
            throw new Error('Expected native Bake metadata object.');
          }
          fs.mkdirSync('.work', {recursive: true});
          fs.writeFileSync('.work/metadata.json', metadata);
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-build-${{ matrix.target }}
          path: |
            .work/bake.json
            .work/metadata.json
          include-hidden-files: true
        env:
          GITHUB_STEP_SUMMARY: /dev/null
      - name: Record this image build result
        if: always()
        env:
          CHECK_NAME: ${{ matrix.label }}
          CHECK_RESULT: ${{ job.status }}
          GITHUB_STEP_SUMMARY: /dev/null
        run: node "$DELIVERY_ROOT"/tools/pipeline/report.mjs validation "$CHECK_NAME" "$CHECK_RESULT" ""
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-image-${{ matrix.target }}
          path: .work/results
          include-hidden-files: true
          if-no-files-found: ignore
        env:
          GITHUB_STEP_SUMMARY: /dev/null
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
